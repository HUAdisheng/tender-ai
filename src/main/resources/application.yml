spring:
  application:
    name: tender-ai
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

ai:
  openai:
    api-key: ${OPENAI_API_KEY:your-api-key-here}
    model: gpt-4
    temperature: 0.7
  vector-store:
    collection-name: user_documents
    host: localhost
    port: 8000

logging:
  level:
    org.springframework.ai: DEBUG
